name: Nightly AI Analysis

on:
  schedule:
    # Run every night at 2 AM UTC (9:30 PM IST)
    - cron: '0 2 * * *'
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check for data changes
        id: check_changes
        run: |
          node check-data-changes.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run AI-enhanced analysis (if data changed)
        if: steps.check_changes.outputs.exit_code == '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "📊 Running AI-enhanced analysis..."
          node combine_and_analyze_with_groq.js
          echo "✅ Analysis complete"

      - name: Update last run timestamp
        run: |
          node -e "
          const fs = require('fs');
          const now = new Date().toISOString();
          const nextRun = new Date(now);
          nextRun.setDate(nextRun.getDate() + 1);

          // Convert to Melbourne time (UTC+10 for AEST, UTC+11 for AEDT)
          const toMelbourneTime = (date) => {
            return date.toLocaleString('en-AU', {
              timeZone: 'Australia/Melbourne',
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });
          };

          let runCount = 1;
          let previousStatus = 'no-changes';

          try {
            const previous = JSON.parse(fs.readFileSync('data/last-run.json'));
            runCount = (previous.run_count || 0) + 1;
            previousStatus = previous.status || 'unknown';
          } catch (e) {}

          const analysisRan = process.env.ANALYSIS_STATUS === 'ran';

          const data = {
            last_run: now,
            last_run_melbourne: toMelbourneTime(new Date(now)),
            next_run: nextRun.toISOString(),
            next_run_melbourne: toMelbourneTime(nextRun),
            run_count: runCount,
            status: analysisRan ? 'success' : 'no-changes',
            last_check: now,
            timezone: 'Australia/Melbourne (UTC+10 AEST / UTC+11 AEDT)'
          };

          fs.writeFileSync('data/last-run.json', JSON.stringify(data, null, 2));
          console.log('Updated last-run.json with Melbourne times');
          console.log('Next run: ' + data.next_run_melbourne);
          "
        env:
          ANALYSIS_STATUS: ${{ steps.check_changes.outputs.exit_code == '0' && 'ran' || 'skipped' }}

      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if there are changes
          if git diff-index --quiet HEAD --; then
            echo "✅ No new data to commit"
          else
            git add data/*.json data/.data-hash
            git commit -m "Workflow update: ${{ steps.check_changes.outputs.exit_code == '0' && 'Ran analysis' || 'No data changes' }} - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
