name: Nightly AI Analysis

on:
  schedule:
    # Run every night at 2 AM UTC (9:30 PM IST)
    - cron: '0 2 * * *'
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run AI-enhanced analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node combine_and_analyze_with_groq.js

      - name: Update last run timestamp
        run: |
          node -e "
          const fs = require('fs');
          const now = new Date().toISOString();
          const nextRun = new Date(now);
          nextRun.setDate(nextRun.getDate() + 1);

          const data = {
            last_run: now,
            next_run: nextRun.toISOString(),
            run_count: (JSON.parse(fs.readFileSync('data/last-run.json')).run_count || 0) + 1,
            status: 'success'
          };

          fs.writeFileSync('data/last-run.json', JSON.stringify(data, null, 2));
          console.log('Updated last-run.json:', data);
          "

      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if there are changes
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git add data/*.json
            git commit -m "Nightly AI analysis update - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
